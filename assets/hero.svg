<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" role="img" aria-labelledby="title desc">
<title id="title">Pasindu Dhanushka — DevOps, Cloud and Software</title>
<desc id="desc">A custom dark navy developer banner with cyan-blue accents and a terminal illustration.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080F22"/><stop offset=".55" stop-color="#0C1E36"/><stop offset="1" stop-color="#113D51"/></linearGradient>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F7FBFF"/><stop offset="1" stop-color="#A9EAF9"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#22D3EE" stop-opacity=".15"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7BA6CC" stroke-opacity=".1" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="352" rx="20" fill="url(#bg)"/>
<rect width="1200" height="352" rx="20" fill="url(#grid)"/>
<circle cx="1050" cy="185" r="280" fill="url(#glow)"/>
<path d="M0 307 H1200" stroke="url(#stroke)" stroke-width="2" opacity=".75"/>
<path d="M20 328 H1180" stroke="#8BD8ED" stroke-opacity=".13"/>
<g transform="translate(51 39)">
  <rect width="185" height="27" rx="13.5" fill="#113449" stroke="#2C8DA4" stroke-opacity=".7"/>
  <circle cx="16" cy="13.5" r="4" fill="#31DFAC"/>
  <text x="28" y="18.5" font-size="11" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.3" fill="#BCEBF4">OPEN TO INTERNSHIPS</text>
</g>
<text x="52" y="124" font-size="15" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="3" fill="#45D9EB">HELLO WORLD — I'M</text>
<text x="48" y="202" font-size="74" font-weight="800" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1" fill="url(#name)">PASINDU</text>
<text x="50" y="268" font-size="65" font-weight="800" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1" fill="url(#name)">DHANUSHKA</text>
<text x="52" y="332" font-size="13" font-weight="600" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2" fill="#B0D8E8">DEVOPS  /  CLOUD  /  SOFTWARE ENGINEERING</text>
<rect x="752" y="54" width="395" height="235" rx="15" fill="#0A1223" stroke="#38617E" stroke-width="1.5"/>
<path d="M752 69 Q752 54 767 54 H1132 Q1147 54 1147 69 V94 H752 Z" fill="#17263D"/>
<circle cx="775" cy="74" r="5.5" fill="#FF667E"/>
<circle cx="794" cy="74" r="5.5" fill="#FACA66"/>
<circle cx="813" cy="74" r="5.5" fill="#47D7AB"/>
<text x="939" y="79" text-anchor="middle" font-size="13" fill="#A9BBCD" font-family="monospace">pasindu@cloud: ~</text>
<text x="777" y="125" font-size="16" fill="#34D9E8" font-family="monospace">$ whoami</text>
<text x="777" y="151" font-size="16" fill="#E6F2FF" font-family="monospace">pasindu-dhanushka</text>
<text x="777" y="187" font-size="16" fill="#34D9E8" font-family="monospace">$ focus --current</text>
<text x="777" y="213" font-size="15" fill="#E6F2FF" font-family="monospace">build  →  automate</text>
<text x="777" y="236" font-size="15" fill="#E6F2FF" font-family="monospace">deploy → improve</text>
<text x="777" y="266" font-size="16" fill="#34D9E8" font-family="monospace">$ <tspan fill="#FFFFFF">▌</tspan></text>
<g opacity=".65" fill="none" stroke="#58CBE8" stroke-width="1.8">
<path d="M694 71 h27 l13 13"/><circle cx="693" cy="71" r="3" fill="#58CBE8"/>
<path d="M1172 145 h-13 l-9 9"/><circle cx="1172" cy="145" r="3" fill="#58CBE8"/>
<path d="M714 248 h-22 l-14 14"/><circle cx="678" cy="262" r="3" fill="#58CBE8"/>
</g>
</svg>